name: Update Graph
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: nirdoshl
          options: bg_color=020818&color=caf0f8&line=0096FF&point=00b4d8&area_color=03045e&area=true&hide_border=true&custom_title=Nirdosh's%202025%20%E2%80%94%202026%20Contribution%20Graph
          output_path: dist/graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
